<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MR Paprika – Administration</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:#fff7f3;color:#2a1410}
header{background:#b3260e;color:#fff;padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:1.2rem}
main{max-width:720px;margin:0 auto;padding:24px 5vw 80px}
h2{font-size:1.1rem;margin:28px 0 8px}
.card,.plat{background:#fff;border:1px solid #e4c3b6;border-radius:10px;padding:16px}
.plat{margin-bottom:14px}
.plat-haut{display:flex;gap:12px;align-items:flex-end}
.champ{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;margin-top:10px}
.champ.grow{flex:1;margin-top:0}
.champ input[type=text],.champ input[type=number],.champ select{width:100%;padding:9px;border:1px solid #c9a89b;border-radius:6px;font:400 1rem system-ui,Arial,sans-serif;background:#fff}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cases{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:.92rem}
.cases label{display:flex;gap:6px;align-items:center;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#f6e1d8;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex:none}
.photo{position:relative}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo input:focus-visible + .btn-s{outline:3px solid #2a1410;outline-offset:2px}
.btn-s{display:inline-block;font-size:.85rem;border:1px solid #b3260e;color:#b3260e;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
.btn-s:hover{background:#b3260e;color:#fff}
.btn-s.danger{border-color:#8a1c1c;color:#8a1c1c}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f0dcd3;flex-wrap:wrap}
.row:first-child{border-top:0}
.row label.nom{flex:1;min-width:120px}
.row input[type=number]{width:120px;padding:8px;border:1px solid #c9a89b;border-radius:6px;font-size:1rem;text-align:right}
input[type=email],input[type=password]{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #c9a89b;border-radius:6px;font-size:1rem}
#loginBtn,#save{background:#b3260e;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-size:1rem;font-weight:700;cursor:pointer}
#addPlat{background:#fff;color:#b3260e;border:2px dashed #b3260e;border-radius:12px;padding:12px;width:100%;font-size:1rem;font-weight:700;cursor:pointer}
button.light{background:transparent;color:#fff;border:1px solid #fff;border-radius:999px;padding:8px 16px;font-size:.9rem;cursor:pointer}
#barre{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4c3b6;padding:10px 5vw;display:flex;gap:14px;align-items:center;z-index:10}
#msg{font-weight:600;flex:1}
.err{color:#b3260e}.ok{color:#1a7a3a}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>MR Paprika – Administration</h1><button id="logout" class="light" hidden>Se déconnecter</button></header>
<main>
<section id="login" class="card">
<h2 style="margin-top:0">Connexion</h2>
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username">
<label for="pwd">Mot de passe</label>
<input id="pwd" type="password" autocomplete="current-password">
<button id="loginBtn">Se connecter</button>
<p id="msg0" class="err" role="status"></p>
</section>

<section id="panel" hidden>
<h2>Menu : plats, prix et photos</h2>
<div id="menu"></div>
<button id="addPlat" type="button">+ Ajouter un plat</button>
<h2>Suppléments des pizzas</h2><div id="supplements" class="card"></div>
<h2>Livraison</h2><div id="livraison" class="card"></div>
</section>
</main>
<div id="barre" hidden><span id="msg" role="status"></span><button id="save">Enregistrer</button></div>
