!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MR Paprika – Administration</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:#fff7f3;color:#2a1410}
header{background:#b3260e;color:#fff;padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:1.2rem}
main{max-width:720px;margin:0 auto;padding:24px 5vw 80px}
h2{font-size:1.1rem;margin:28px 0 8px}
.card,.plat{background:#fff;border:1px solid #e4c3b6;border-radius:10px;padding:16px}
.plat{margin-bottom:14px}
.plat-haut{display:flex;gap:12px;align-items:flex-end}
.champ{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;margin-top:10px}
.champ.grow{flex:1;margin-top:0}
.champ input[type=text],.champ input[type=number],.champ select{width:100%;padding:9px;border:1px solid #c9a89b;border-radius:6px;font:400 1rem system-ui,Arial,sans-serif;background:#fff}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cases{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:.92rem}
.cases label{display:flex;gap:6px;align-items:center;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#f6e1d8;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex:none}
.photo{position:relative}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo input:focus-visible + .btn-s{outline:3px solid #2a1410;outline-offset:2px}
.btn-s{display:inline-block;font-size:.85rem;border:1px solid #b3260e;color:#b3260e;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
.btn-s:hover{background:#b3260e;color:#fff}
.btn-s.danger{border-color:#8a1c1c;color:#8a1c1c}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f0dcd3;flex-wrap:wrap}
.row:first-child{border-top:0}
.row label.nom{flex:1;min-width:120px}
.row input[type=number]{width:120px;padding:8px;border:1px solid #c9a89b;border-radius:6px;font-size:1rem;text-align:right}
input[type=email],input[type=password]{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #c9a89b;border-radius:6px;font-size:1rem}
#loginBtn,#save{background:#b3260e;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-size:1rem;font-weight:700;cursor:pointer}
#addPlat{background:#fff;color:#b3260e;border:2px dashed #b3260e;border-radius:12px;padding:12px;width:100%;font-size:1rem;font-weight:700;cursor:pointer}
button.light{background:transparent;color:#fff;border:1px solid #fff;border-radius:999px;padding:8px 16px;font-size:.9rem;cursor:pointer}
#barre{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4c3b6;padding:10px 5vw;display:flex;gap:14px;align-items:center;z-index:10}
#msg{font-weight:600;flex:1}
.err{color:#b3260e}.ok{color:#1a7a3a}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>MR Paprika – Administration</h1><button id="logout" class="light" hidden>Se déconnecter</button></header>
<main>
<section id="login" class="card">
<h2 style="margin-top:0">Connexion</h2>
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username">
<label for="pwd">Mot de passe</label>
<input id="pwd" type="password" autocomplete="current-password">
<button id="loginBtn">Se connecter</button>
<p id="msg0" class="err" role="status"></p>
</section>

<section id="panel" hidden>
<h2>Menu : plats, prix et photos</h2>
<div id="menu"></div>
<button id="addPlat" type="button">+ Ajouter un plat</button>
<h2>Suppléments des pizzas</h2><div id="supplements" class="card"></div>
<h2>Livraison</h2><div id="livraison" class="card"></div>
</section>
</main>
<div id="barre" hidden><span id="msg" role="status"></span><button id="save">Enregistrer</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="catalogue.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtr8Eb-npB9m2OArnkKXhhLr7P-v42waA",
  authDomain: "mr-paprika.firebaseapp.com",
  projectId: "mr-paprika"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ref = db.doc('config/prix');

const CATS = ['Classique','Viande','Végétarienne','Poisson','Spéciale','Boisson','Dessert','Autre'];
const MENU_DEF = [
  {id:'margherita',    nom:'Margherita',      desc:'Tomate, mozzarella, basilic frais.',      cat:'Classique',    prix:4000, pizza:true, actif:true},
  {id:'pepperoni',     nom:'Pepperoni',       desc:'Tomate, mozzarella, pepperoni épicé.',    cat:'Viande',       prix:4500, pizza:true, actif:true},
  {id:'vegetarienne',  nom:'Végétarienne',    desc:'Poivrons, champignons, olives, oignons.', cat:'Végétarienne', prix:4500, pizza:true, actif:true},
  {id:'quatrefromages',nom:'Quatre Fromages', desc:'Mozzarella, chèvre, bleu et emmental.',   cat:'Classique',    prix:5000, pizza:true, actif:true}
];
const SUPP_DEF = {
  'extra-cheese':   {nom:'Fromage supplémentaire', prix:1000},
  'extra-olives':   {nom:'Olives',                 prix:500},
  'extra-mushrooms':{nom:'Champignons',            prix:500}
};

const $ = id => document.getElementById(id);
let data = null;
let images = {};      // photos actuelles (id -> data URL)
let modifiees = {};   // photos à enregistrer (id -> data URL, ou null pour retirer)

function say(text, cls){ const m=$('msg'); m.textContent=text; m.className=cls||''; }

function redimensionner(file){
  return new Promise((ok, ko) => {
    if (!file.type.startsWith('image/')) return ko(new Error("Ce fichier n'est pas une image."));
    const r = new FileReader();
    r.onerror = () => ko(new Error('Lecture impossible.'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => ko(new Error('Image illisible (essayez une photo JPG ou PNG).'));
      img.onload = () => {
        const s = Math.min(1, 700 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const out = c.toDataURL('image/jpeg', 0.72);
        out.length > 400000 ? ko(new Error('Image trop lourde.')) : ok(out);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function vignette(box, id){
  box.textContent = '';
  const src = id in modifiees ? modifiees[id] : images[id];
  if (src) { const i = document.createElement('img'); i.className='thumb'; i.src=src; i.alt=''; box.appendChild(i); }
  else { const d = document.createElement('div'); d.className='thumb'; d.textContent='🍽️'; box.appendChild(d); }
}

function champ(label, el, cls){
  const l = document.createElement('label'); l.className = 'champ ' + (cls || '');
  const s = document.createElement('span'); s.textContent = label;
  l.append(s, el); return l;
}

function renderMenu(){
  const box = $('menu'); box.textContent = '';
  if (!data.menu.length) {
    const p = document.createElement('p'); p.textContent = 'Aucun plat pour le moment. Cliquez sur « Ajouter un plat ».'; box.appendChild(p);
    return;
  }
  data.menu.forEach((it, idx) => {
    const card = document.createElement('div'); card.className = 'plat';

    const haut = document.createElement('div'); haut.className = 'plat-haut';
    const tb = document.createElement('div'); vignette(tb, it.id);
    const nom = document.createElement('input'); nom.type = 'text'; nom.value = it.nom || ''; nom.maxLength = 60;
    nom.addEventListener('input', () => { it.nom = nom.value; });
    haut.append(tb, champ('Nom du plat', nom, 'grow'));

    const desc = document.createElement('input'); desc.type = 'text'; desc.value = it.desc || ''; desc.maxLength = 140;
    desc.placeholder = 'Ingrédients ou courte description';
    desc.addEventListener('input', () => { it.desc = desc.value; });

    const cat = document.createElement('select');
    const liste = CATS.indexOf(it.cat) < 0 ? CATS.concat([it.cat]) : CATS;
    liste.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; cat.appendChild(o); });
    cat.value = it.cat;
    cat.addEventListener('change', () => { it.cat = cat.value; });

    const prix = document.createElement('input'); prix.type = 'number'; prix.min = '0'; prix.step = '50'; prix.inputMode = 'numeric';
    prix.value = it.prix || 0;
    prix.addEventListener('input', () => { it.prix = Math.max(0, Math.round(Number(prix.value) || 0)); });

    const l2 = document.createElement('div'); l2.className = 'ligne2';
    l2.append(champ('Catégorie', cat), champ(it.pizza ? 'Prix petite pizza (FCFA)' : 'Prix (FCFA)', prix));

    const cases = document.createElement('div'); cases.className = 'cases';
    function caseA(texte, cle){
      const l = document.createElement('label'); const c = document.createElement('input'); c.type = 'checkbox';
      c.checked = it[cle] !== false && !!it[cle];
      c.addEventListener('change', () => { it[cle] = c.checked; if (cle === 'pizza') renderMenu(); });
      const s = document.createElement('span'); s.textContent = texte; l.append(c, s); cases.appendChild(l);
    }
    caseA('C’est une pizza (tailles et suppléments)', 'pizza');
    caseA('Visible sur le site', 'actif');

    const actions = document.createElement('div'); actions.className = 'actions';
    const wrap = document.createElement('label'); wrap.className = 'photo';
    const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*';
    file.setAttribute('aria-label', 'Changer la photo de ' + (it.nom || 'ce plat'));
    const bphoto = document.createElement('span'); bphoto.className = 'btn-s'; bphoto.textContent = 'Changer la photo';
    file.addEventListener('change', async () => {
      if (!file.files[0]) return;
      try { modifiees[it.id] = await redimensionner(file.files[0]); vignette(tb, it.id); say('Photo prête. Cliquez sur « Enregistrer ».', 'ok'); }
      catch(e){ say(e.message, 'err'); }
      file.value = '';
    });
    wrap.append(file, bphoto);
    const ret = document.createElement('button'); ret.type = 'button'; ret.className = 'btn-s'; ret.textContent = 'Retirer la photo';
    ret.addEventListener('click', () => { modifiees[it.id] = null; vignette(tb, it.id); say('Photo retirée. Cliquez sur « Enregistrer ».', 'ok'); });
    const sup = document.createElement('button'); sup.type = 'button'; sup.className = 'btn-s danger'; sup.textContent = 'Supprimer le plat';
    sup.addEventListener('click', () => {
      if (!confirm('Supprimer « ' + (it.nom || 'ce plat') + ' » ?')) return;
      modifiees[it.id] = null; data.menu.splice(idx, 1); renderMenu();
      say('Plat supprimé. Cliquez sur « Enregistrer » pour confirmer.', 'ok');
    });
    actions.append(wrap, ret, sup);

    card.append(haut, champ('Description', desc), l2, cases, actions);
    box.appendChild(card);
  });
}

function renderPrix(items, conteneur){
  const box = $(conteneur); box.textContent = '';
  for (const [id, item] of Object.entries(items)) {
    const row = document.createElement('div'); row.className = 'row';
    const label = document.createElement('label'); label.className = 'nom'; label.textContent = item.nom; label.htmlFor = conteneur + '-' + id;
    const input = document.createElement('input'); input.type = 'number'; input.min = '0'; input.step = '50'; input.inputMode = 'numeric';
    input.id = conteneur + '-' + id; input.value = item.prix;
    input.addEventListener('input', () => { item.prix = Math.max(0, Math.round(Number(input.value) || 0)); });
    const unit = document.createElement('span'); unit.textContent = 'FCFA';
    row.append(label, input, unit); box.appendChild(row);
  }
}

async function charger(){
  try {
    const snap = await ref.get();
    const d = snap.exists ? snap.data() : {};
    data = {
      menu: Array.isArray(d.menu) ? d.menu : MENU_DEF.map(x => ({...x, prix: (d.pizzas && d.pizzas[x.id]) ? d.pizzas[x.id].prix : x.prix})),
      supplements: Object.assign(JSON.parse(JSON.stringify(SUPP_DEF)), d.supplements || {}),
      livraison: d.livraison || {livraison:{nom:'Livraison à domicile', prix:1500}}
    };
    images = {}; modifiees = {};
    const imgs = await db.collection('images').get();
    imgs.forEach(x => { images[x.id] = x.data().data; });
    renderMenu(); renderPrix(data.supplements, 'supplements'); renderPrix(data.livraison, 'livraison');
  } catch(e){ say('Impossible de charger les données : ' + e.message, 'err'); }
}

$('loginBtn').onclick = async () => {
  $('msg0').textContent = '';
  try { await auth.signInWithEmailAndPassword($('email').value.trim(), $('pwd').value); }
  catch(e){ $('msg0').textContent = 'Connexion refusée : e-mail ou mot de passe incorrect.'; }
};
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logout').onclick = () => auth.signOut();

$('addPlat').onclick = () => {
  data.menu.push({id:'p' + Date.now().toString(36), nom:'Nouveau plat', desc:'', cat:'Autre', prix:0, pizza:false, actif:true});
  renderMenu();
  say('Plat ajouté en bas de la liste : complétez-le, puis enregistrez.', 'ok');
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
};

$('save').onclick = async () => {
  if (data.menu.some(it => !String(it.nom || '').trim())) return say('Donnez un nom à chaque plat.', 'err');
  data.menu.forEach(it => {
    it.nom = it.nom.trim(); it.desc = (it.desc || '').trim();
    it.prix = Math.max(0, Math.round(Number(it.prix) || 0));
    it.pizza = !!it.pizza; it.actif = it.actif !== false;
  });
  try {
    await ref.set(data);
    const batch = db.batch();
    for (const [id, src] of Object.entries(modifiees)) {
      const dref = db.doc('images/' + id);
      src ? batch.set(dref, { data: src }) : batch.delete(dref);
    }
    await batch.commit();
    Object.entries(modifiees).forEach(([id, src]) => { if (src) images[id] = src; else delete images[id]; });
    modifiees = {};
    say('Enregistré. Le site est à jour.', 'ok');
  } catch(e){ say("Enregistrement refusé. Vérifiez que vous êtes connecté avec le compte administrateur.", 'err'); }
};

auth.onAuthStateChanged(user => {
  $('login').hidden = !!user; $('panel').hidden = !user; $('logout').hidden = !user; $('barre').hidden = !user;
  if (user) charger();
});
</script>
</body>
</html>
